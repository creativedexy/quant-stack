<div class="card chart-sub-panel">
  <h4 class="chart-panel-title">RSI ({{ rsi_data.window }})</h4>
  <svg class="chart-svg chart-svg-sm" viewBox="0 0 900 100" preserveAspectRatio="none">
    <!-- Overbought / oversold zones -->
    <rect x="40" y="0" width="820" height="30" fill="var(--negative)" opacity="0.04" />
    <rect x="40" y="70" width="820" height="30" fill="var(--positive)" opacity="0.04" />
    <line x1="40" y1="30" x2="860" y2="30"
          stroke="var(--negative)" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.4" />
    <line x1="40" y1="50" x2="860" y2="50"
          stroke="var(--muted-line)" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.3" />
    <line x1="40" y1="70" x2="860" y2="70"
          stroke="var(--positive)" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.4" />

    {% if rsi_data.rsi %}
    {% set rsi_pts = to_svg_points(rsi_data.dates, rsi_data.rsi, 900, 100) %}
    {% if rsi_pts %}
    <polyline points="{{ rsi_pts }}"
              fill="none" stroke="var(--accent)" stroke-width="1.2"
              stroke-linejoin="round" stroke-linecap="round" />
    {% endif %}
    {% else %}
    <text x="450" y="55" text-anchor="middle" fill="var(--muted)" font-size="12">
      No RSI data available
    </text>
    {% endif %}

    <!-- Y-axis labels -->
    <text x="35" y="10" text-anchor="end" fill="var(--muted)" font-size="9">100</text>
    <text x="35" y="33" text-anchor="end" fill="var(--muted)" font-size="9">70</text>
    <text x="35" y="53" text-anchor="end" fill="var(--muted)" font-size="9">50</text>
    <text x="35" y="73" text-anchor="end" fill="var(--muted)" font-size="9">30</text>
    <text x="35" y="98" text-anchor="end" fill="var(--muted)" font-size="9">0</text>
  </svg>
</div>
