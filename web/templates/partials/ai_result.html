{# AI analysis result -- loaded via HTMX POST to /ui/analyse/ai-dive #}
<div class="ai-card ai-card-amber" style="margin-top:0.5rem;">
  <div style="display:flex;align-items:flex-start;gap:0.75rem;">
    <div class="ai-card-icon" style="background:var(--amber-dim);color:var(--amber);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 14v-4m0-4h.01"/>
      </svg>
    </div>
    <div style="flex:1;min-width:0;">
      <div style="font-weight:600;font-size:0.85rem;margin-bottom:0.35rem;">
        AI Analysis for <span class="text-cyan font-mono">{{ ticker }}</span>
      </div>
      <div class="text-muted" style="font-size:0.8rem;line-height:1.6;white-space:pre-line;">{{ analysis }}</div>
    </div>
  </div>
</div>
