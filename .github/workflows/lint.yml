name: Lint

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ruff:
    name: Ruff Linter
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check src/ tests/ --select E,F,W --ignore E501
