[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "smart-dca"
version = "0.1.0"
description = "Signal-driven DCA execution system for BTC, ETH, and XRP on Binance"
requires-python = ">=3.11"
dependencies = [
    # Trading
    "python-binance>=1.0.19",
    # Signals / Data
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    # Config / Utils
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    # Scheduling
    "apscheduler>=3.10",
    # Monitoring
    "streamlit>=1.35",
    "sqlalchemy>=2.0",
    # Notifications
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
